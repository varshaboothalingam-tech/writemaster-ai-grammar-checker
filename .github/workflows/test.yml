name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: |
          python -m spacy download en_core_web_sm

      - name: Download NLTK corpora (test-only paths)
        run: |
          python -c "import nltk; nltk.download('words'); nltk.download('wordnet')"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -q

      - name: Verify serverless API imports (stdlib-only)
        run: |
          python -c "import api.index as s; assert s.wsgi_app is not None"
        env:
          PYTHONPATH: .