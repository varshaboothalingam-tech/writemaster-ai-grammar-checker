name: nightly-ai-sweep
on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_PROVIDER: "gemini"
      GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
      GC_AI_PROVIDERS: "ollama,gemini"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: deps
        run: |
          pip install -q -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: AI sweep (append-only, no auto-promote)
        run: python -X utf8 scripts/ai_sweep.py --json
      - name: rebuild leakage-free splits
        run: python -X utf8 scripts/build_splits.py --check
      - name: promotion gate (precision floor 0.95)
        run: python -X utf8 scripts/promote_rules.py --only-show
      - name: full regression suite
        run: python -X utf8 -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: |
            datasets/*.jsonl
            results/*.json
